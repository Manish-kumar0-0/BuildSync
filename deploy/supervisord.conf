[supervisord]
nodaemon=true
user=root

[program:backend]
directory=/app/backend
command=python3 -m uvicorn app.main:app --host 0.0.0.0 --port %(ENV_BACKEND_PORT)s
environment=PYTHONPATH="/app/backend"
autostart=true
autorestart=true
priority=10

[program:frontend]
directory=/app/site-intel-pro
command=node .output/server/index.mjs --host 127.0.0.1 --port %(ENV_FRONTEND_PORT)s
environment=PORT="%(ENV_FRONTEND_PORT)s",HOST="127.0.0.1"
autostart=true
autorestart=true
priority=20

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
